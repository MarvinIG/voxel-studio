Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection
Section "Device"
    Identifier "Dummy"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "Monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1440x920" 110.0 1440 1488 1520 1600 920 923 929 960
EndSection
Section "Screen"
    Identifier "Screen"
    Device "Dummy"
    Monitor "Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1440x920"
    EndSubSection
EndSection
